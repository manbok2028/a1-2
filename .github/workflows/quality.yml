name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package installation
        run: python -m pip install --no-deps .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
