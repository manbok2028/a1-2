[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-travel-planner"
version = "1.0.0"
description = "CLI travel recommendation pipeline using an LLM and Kakao Local API."
requires-python = ">=3.10"

[project.scripts]
travel-planner = "travel_planner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
